# Example thresholds: tune against staging traffic and pool budgets.
groups:
  - name: board-http
    rules:
      - alert: BoardHttpDown
        expr: up{job=~"board-(public|staff|media)"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Target cannot be scraped
      - alert: BoardHttp5xx
        expr: |
          (
            sum by (job, instance, listener) (rate(board_http_responses_total{status_class="5xx"}[5m]))
            / sum by (job, instance, listener) (rate(board_http_responses_total[5m])) > 0.05
          )
          and sum by (job, instance, listener) (rate(board_http_responses_total[5m])) >= 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: HTTP server errors exceed the example budget
      - alert: BoardHttpWriteRejections
        expr: rate(board_http_write_rejections_total[5m]) > 0.2
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: HTTP write rejections are elevated
      - alert: BoardStaffAuthorizationRejections
        expr: rate(board_http_authorization_rejections_total{listener="staff"}[5m]) > 0.1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Staff authorization rejections are elevated
      - alert: BoardDbPoolPressure
        expr: |
          (
            (board_db_pool_connections - board_db_pool_idle)
            / board_db_pool_max_connections > 0.9
          )
          and board_db_pool_max_connections > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Database pool has little idle capacity
  - name: board-media-queue
    rules:
      - alert: BoardMediaObserverUnavailable
        expr: |
          (up{job="board-monitor"} == 0)
          or
          (
            up{job="board-monitor"}
            unless on (job, instance)
            (
              (board_media_sample_success{job="board-monitor"} == 1)
              and on (job, instance)
              (time() - board_media_sample_last_success_timestamp_seconds{job="board-monitor"} <= 30)
            )
          )
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: Media queue observer is unavailable or stale
      - alert: BoardMediaQueuePressure
        expr: |
          (
            sum by (job, instance) (board_media_jobs{job="board-monitor",state=~"receiving|queued|processing"})
            / board_media_queue_capacity{job="board-monitor"} > 0.9
          )
          and on (job, instance) (board_media_queue_capacity{job="board-monitor"} > 0)
          and on (job, instance) (up{job="board-monitor"} == 1)
          and on (job, instance) (board_media_sample_success{job="board-monitor"} == 1)
          and on (job, instance) (time() - board_media_sample_last_success_timestamp_seconds{job="board-monitor"} <= 30)
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Media queue exceeds the example capacity budget
      - alert: BoardMediaProcessingFailures
        expr: |
          sum by (job, instance) (board_media_failures_recent{job="board-monitor",reason=~"processing_failed|invalid_output|retry_exhausted"}) > 0
          and on (job, instance) (up{job="board-monitor"} == 1)
          and on (job, instance) (board_media_sample_success{job="board-monitor"} == 1)
          and on (job, instance) (time() - board_media_sample_last_success_timestamp_seconds{job="board-monitor"} <= 30)
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: Recent media processing failures require investigation
      - alert: BoardMediaIntakeFailures
        expr: |
          sum by (job, instance) (board_media_failures_recent{job="board-monitor",reason=~"intake_failed|abandoned"}) > 0
          and on (job, instance) (up{job="board-monitor"} == 1)
          and on (job, instance) (board_media_sample_success{job="board-monitor"} == 1)
          and on (job, instance) (time() - board_media_sample_last_success_timestamp_seconds{job="board-monitor"} <= 30)
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: Recent media intake failures require investigation
      - alert: BoardMediaExpiredJobs
        expr: |
          sum by (job, instance) (board_media_expired_jobs{job="board-monitor",state=~"receiving|queued|processing"}) > 0
          and on (job, instance) (up{job="board-monitor"} == 1)
          and on (job, instance) (board_media_sample_success{job="board-monitor"} == 1)
          and on (job, instance) (time() - board_media_sample_last_success_timestamp_seconds{job="board-monitor"} <= 30)
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Media queue contains expired active jobs
  - name: board-resource
    rules:
      - alert: BoardResourceObserverUnavailable
        expr: |
          (up{job="board-resource"} == 0)
          or
          (
            up{job="board-resource"}
            unless on (job, instance)
            (
              (board_resource_sample_success{job="board-resource"} == 1)
              and on (job, instance)
              (time() - board_resource_sample_last_success_timestamp_seconds{job="board-resource"} <= 30)
            )
          )
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: Resource observer is unavailable or stale
      - alert: BoardStorageBytesPressure
        expr: |
          (board_storage_available_bytes{job="board-resource"} / board_storage_capacity_bytes{job="board-resource"} < 0.1)
          and (board_storage_capacity_bytes{job="board-resource"} > 0)
          and on (job, instance) (up{job="board-resource"} == 1)
          and on (job, instance) (board_resource_sample_success{job="board-resource"} == 1)
          and on (job, instance) (time() - board_resource_sample_last_success_timestamp_seconds{job="board-resource"} <= 30)
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Storage available bytes are below ten percent
      - alert: BoardStorageInodesPressure
        expr: |
          (board_storage_available_inodes{job="board-resource"} / board_storage_inodes{job="board-resource"} < 0.1)
          and (board_storage_inodes{job="board-resource"} > 0)
          and on (job, instance) (up{job="board-resource"} == 1)
          and on (job, instance) (board_resource_sample_success{job="board-resource"} == 1)
          and on (job, instance) (time() - board_resource_sample_last_success_timestamp_seconds{job="board-resource"} <= 30)
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Storage available inodes are below ten percent
      - alert: BoardStorageReadOnly
        expr: |
          (board_storage_read_only{job="board-resource"} == 1)
          and on (job, instance) (up{job="board-resource"} == 1)
          and on (job, instance) (board_resource_sample_success{job="board-resource"} == 1)
          and on (job, instance) (time() - board_resource_sample_last_success_timestamp_seconds{job="board-resource"} <= 30)
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: Storage filesystem is read-only
      - alert: BoardServiceMemoryPressure
        expr: |
          (board_service_memory_bytes{job="board-resource"} / board_service_memory_limit_bytes{job="board-resource"} > 0.9)
          and (board_service_memory_limit_bytes{job="board-resource"} > 0)
          and on (job, instance) (up{job="board-resource"} == 1)
          and on (job, instance) (board_resource_sample_success{job="board-resource"} == 1)
          and on (job, instance) (time() - board_resource_sample_last_success_timestamp_seconds{job="board-resource"} <= 30)
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Service memory exceeds ninety percent of its local ceiling
      - alert: BoardServiceTasksPressure
        expr: |
          (board_service_tasks{job="board-resource"} / board_service_tasks_limit{job="board-resource"} > 0.9)
          and (board_service_tasks_limit{job="board-resource"} > 0)
          and on (job, instance) (up{job="board-resource"} == 1)
          and on (job, instance) (board_resource_sample_success{job="board-resource"} == 1)
          and on (job, instance) (time() - board_resource_sample_last_success_timestamp_seconds{job="board-resource"} <= 30)
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Service tasks exceed ninety percent of their local ceiling
      - alert: BoardServiceCpuThrottling
        expr: |
          (rate(board_service_cpu_throttled_periods_total{job="board-resource"}[5m]) / rate(board_service_cpu_periods_total{job="board-resource"}[5m]) > 0.2)
          and (rate(board_service_cpu_periods_total{job="board-resource"}[5m]) > 0)
          and on (job, instance) (up{job="board-resource"} == 1)
          and on (job, instance) (board_resource_sample_success{job="board-resource"} == 1)
          and on (job, instance) (time() - board_resource_sample_last_success_timestamp_seconds{job="board-resource"} <= 30)
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Service CPU throttled periods exceed twenty percent
      - alert: BoardServiceOomKills
        expr: |
          (increase(board_service_memory_oom_kills_total{job="board-resource"}[5m]) > 0)
          and on (job, instance) (up{job="board-resource"} == 1)
          and on (job, instance) (board_resource_sample_success{job="board-resource"} == 1)
          and on (job, instance) (time() - board_resource_sample_last_success_timestamp_seconds{job="board-resource"} <= 30)
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: Service cgroup reports recent OOM kills
  - name: board-maintenance
    rules:
      - alert: BoardMaintenanceObserverUnavailable
        expr: |
          (up{job="board-maintenance"} == 0)
          or
          (
            up{job="board-maintenance"}
            unless on (job, instance)
            (
              board_maintenance_sample_success{job="board-maintenance"}
              or board_maintenance_sample_last_success_timestamp_seconds{job="board-maintenance"}
            )
          )
          or
          (
            (
              (
                board_maintenance_sample_success{job="board-maintenance"}
                or board_maintenance_sample_last_success_timestamp_seconds{job="board-maintenance"}
              )
              unless on (job, instance, maintenance)
              (
                (board_maintenance_sample_success{job="board-maintenance"} == 1)
                and on (job, instance, maintenance)
                (time() - board_maintenance_sample_last_success_timestamp_seconds{job="board-maintenance"} <= 30)
              )
            )
            and on (job, instance) (up{job="board-maintenance"} == 1)
          )
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: Maintenance observer is unavailable or stale
      - alert: BoardMaintenanceFailed
        expr: |
          (board_maintenance_failure_pending{job="board-maintenance"} == 1)
          and on (job, instance, maintenance) (board_maintenance_sample_success{job="board-maintenance"} == 1)
          and on (job, instance, maintenance) (time() - board_maintenance_sample_last_success_timestamp_seconds{job="board-maintenance"} <= 30)
          and on (job, instance) (up{job="board-maintenance"} == 1)
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: Maintenance command failure remains unresolved
      - alert: BoardMaintenanceOverdue
        expr: |
          (
            (board_maintenance_last_success_timestamp_seconds{job="board-maintenance"} == 0)
            or
            (
              time() - board_maintenance_last_success_timestamp_seconds{job="board-maintenance"}
              > board_maintenance_max_age_seconds{job="board-maintenance"}
            )
            or
            (
              (board_maintenance_run_in_progress{job="board-maintenance"} == 1)
              and on (job, instance, maintenance)
              (
                time() - board_maintenance_run_started_timestamp_seconds{job="board-maintenance"}
                > board_maintenance_run_timeout_seconds{job="board-maintenance"}
              )
            )
          )
          and on (job, instance, maintenance) (board_maintenance_sample_success{job="board-maintenance"} == 1)
          and on (job, instance, maintenance) (time() - board_maintenance_sample_last_success_timestamp_seconds{job="board-maintenance"} <= 30)
          and on (job, instance) (up{job="board-maintenance"} == 1)
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: Maintenance command success or completion is overdue
