# Example thresholds: tune against staging traffic and pool budgets.
groups:
  - name: board-http
    rules:
      - alert: BoardHttpDown
        expr: up{job=~"board-(public|staff|media)"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Target cannot be scraped
      - alert: BoardHttp5xx
        expr: |
          (
            sum by (job, instance, listener) (rate(board_http_responses_total{status_class="5xx"}[5m]))
            / sum by (job, instance, listener) (rate(board_http_responses_total[5m])) > 0.05
          )
          and sum by (job, instance, listener) (rate(board_http_responses_total[5m])) >= 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: HTTP server errors exceed the example budget
      - alert: BoardHttpWriteRejections
        expr: rate(board_http_write_rejections_total[5m]) > 0.2
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: HTTP write rejections are elevated
      - alert: BoardStaffAuthorizationRejections
        expr: rate(board_http_authorization_rejections_total{listener="staff"}[5m]) > 0.1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Staff authorization rejections are elevated
      - alert: BoardDbPoolPressure
        expr: |
          (
            (board_db_pool_connections - board_db_pool_idle)
            / board_db_pool_max_connections > 0.9
          )
          and board_db_pool_max_connections > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Database pool has little idle capacity
  - name: board-media-queue
    rules:
      - alert: BoardMediaObserverUnavailable
        expr: |
          (up{job="board-monitor"} == 0)
          or
          (
            up{job="board-monitor"}
            unless on (job, instance)
            (
              (board_media_sample_success{job="board-monitor"} == 1)
              and on (job, instance)
              (time() - board_media_sample_last_success_timestamp_seconds{job="board-monitor"} <= 30)
            )
          )
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: Media queue observer is unavailable or stale
      - alert: BoardMediaQueuePressure
        expr: |
          (
            sum by (job, instance) (board_media_jobs{job="board-monitor",state=~"receiving|queued|processing"})
            / board_media_queue_capacity{job="board-monitor"} > 0.9
          )
          and on (job, instance) (board_media_queue_capacity{job="board-monitor"} > 0)
          and on (job, instance) (up{job="board-monitor"} == 1)
          and on (job, instance) (board_media_sample_success{job="board-monitor"} == 1)
          and on (job, instance) (time() - board_media_sample_last_success_timestamp_seconds{job="board-monitor"} <= 30)
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Media queue exceeds the example capacity budget
      - alert: BoardMediaProcessingFailures
        expr: |
          sum by (job, instance) (board_media_failures_recent{job="board-monitor",reason=~"processing_failed|invalid_output|retry_exhausted"}) > 0
          and on (job, instance) (up{job="board-monitor"} == 1)
          and on (job, instance) (board_media_sample_success{job="board-monitor"} == 1)
          and on (job, instance) (time() - board_media_sample_last_success_timestamp_seconds{job="board-monitor"} <= 30)
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: Recent media processing failures require investigation
      - alert: BoardMediaIntakeFailures
        expr: |
          sum by (job, instance) (board_media_failures_recent{job="board-monitor",reason=~"intake_failed|abandoned"}) > 0
          and on (job, instance) (up{job="board-monitor"} == 1)
          and on (job, instance) (board_media_sample_success{job="board-monitor"} == 1)
          and on (job, instance) (time() - board_media_sample_last_success_timestamp_seconds{job="board-monitor"} <= 30)
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: Recent media intake failures require investigation
      - alert: BoardMediaExpiredJobs
        expr: |
          sum by (job, instance) (board_media_expired_jobs{job="board-monitor",state=~"receiving|queued|processing"}) > 0
          and on (job, instance) (up{job="board-monitor"} == 1)
          and on (job, instance) (board_media_sample_success{job="board-monitor"} == 1)
          and on (job, instance) (time() - board_media_sample_last_success_timestamp_seconds{job="board-monitor"} <= 30)
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Media queue contains expired active jobs
