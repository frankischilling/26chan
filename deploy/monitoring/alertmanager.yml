# A local example receiver, not a deployed operator notification destination.
route:
  receiver: local-operator-webhook
  group_by: [alertname, job, instance, listener, pool, storage, service, maintenance]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
receivers:
  - name: local-operator-webhook
    webhook_configs:
      - url: http://127.0.0.1:9095/alerts
        send_resolved: true
