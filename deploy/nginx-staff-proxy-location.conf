# Include inside the staff HTTPS server, with a dedicated nonroot worker UID.
# The configured worker must belong to board-staff-edge for socket access.
location / {
    proxy_pass http://unix:/run/board-staff/staff.sock:;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Board-Client-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
}
