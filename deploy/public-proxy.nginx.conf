# Public HTTPS server only. Include inside an operator-owned http block.
# The dedicated worker user must match PUBLIC_PROXY_UID and belong to board-edge.
# Do not enable real_ip_header, set_real_ip_from or PROXY protocol on this edge.
server {
    listen 443 ssl;
    server_name boards.example.com;
    ssl_certificate /etc/paperboard/tls/public.crt;
    ssl_certificate_key /etc/paperboard/tls/public.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /var/log/nginx/board-public-error.log crit;
    client_max_body_size 256k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 15s;
    keepalive_timeout 15s;
    if ($host != boards.example.com) { return 444; }
    location / {
        proxy_pass http://unix:/run/paperboard-public/public.sock;
        proxy_http_version 1.1;
        # The finite image allowlist makes CSP exceed the default 4 KiB buffer.
        proxy_buffer_size 64k;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Board-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header Forwarded "";
        proxy_connect_timeout 2s;
        proxy_send_timeout 10s;
        proxy_read_timeout 15s;
        proxy_next_upstream off;
    }
}
