{
  "rule_files": [
    "../../deploy/monitoring/alerts.yml"
  ],
  "evaluation_interval": "1m",
  "tests": [
    {
      "name": "BoardHttpDown healthy, pending, firing, recovery",
      "interval": "1m",
      "input_series": [
        {
          "series": "up{job=\"board-public\",instance=\"fixture:1\"}",
          "values": "1x10 0x9 1x10"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "10m",
          "alertname": "BoardHttpDown",
          "exp_alerts": []
        },
        {
          "eval_time": "12m",
          "alertname": "BoardHttpDown",
          "exp_alerts": []
        },
        {
          "eval_time": "18m",
          "alertname": "BoardHttpDown",
          "exp_alerts": [
            {
              "exp_labels": {
                "job": "board-public",
                "instance": "fixture:1",
                "severity": "warning"
              },
              "exp_annotations": {
                "summary": "Target cannot be scraped"
              }
            }
          ]
        },
        {
          "eval_time": "30m",
          "alertname": "BoardHttpDown",
          "exp_alerts": []
        }
      ],
      "promql_expr_test": [
        {
          "expr": "ALERTS{alertname=\"BoardHttpDown\",alertstate=\"pending\"}",
          "eval_time": "12m",
          "exp_samples": [
            {
              "labels": "{__name__=\"ALERTS\",alertname=\"BoardHttpDown\",alertstate=\"pending\",instance=\"fixture:1\",job=\"board-public\",severity=\"warning\"}",
              "value": 1
            }
          ]
        }
      ]
    },
    {
      "name": "BoardHttp5xx healthy, pending, firing, recovery",
      "interval": "1m",
      "input_series": [
        {
          "series": "board_http_responses_total{job=\"board-public\",instance=\"fixture:1\",listener=\"public\",status_class=\"2xx\"}",
          "values": "0+120x30"
        },
        {
          "series": "board_http_responses_total{job=\"board-public\",instance=\"fixture:1\",listener=\"public\",status_class=\"5xx\"}",
          "values": "0x10 120+120x9 1200x10"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "10m",
          "alertname": "BoardHttp5xx",
          "exp_alerts": []
        },
        {
          "eval_time": "12m",
          "alertname": "BoardHttp5xx",
          "exp_alerts": []
        },
        {
          "eval_time": "18m",
          "alertname": "BoardHttp5xx",
          "exp_alerts": [
            {
              "exp_labels": {
                "job": "board-public",
                "instance": "fixture:1",
                "listener": "public",
                "severity": "warning"
              },
              "exp_annotations": {
                "summary": "HTTP server errors exceed the example budget"
              }
            }
          ]
        },
        {
          "eval_time": "30m",
          "alertname": "BoardHttp5xx",
          "exp_alerts": []
        }
      ],
      "promql_expr_test": [
        {
          "expr": "ALERTS{alertname=\"BoardHttp5xx\",alertstate=\"pending\"}",
          "eval_time": "12m",
          "exp_samples": [
            {
              "labels": "{__name__=\"ALERTS\",alertname=\"BoardHttp5xx\",alertstate=\"pending\",instance=\"fixture:1\",job=\"board-public\",listener=\"public\",severity=\"warning\"}",
              "value": 1
            }
          ]
        }
      ]
    },
