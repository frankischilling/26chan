    {
      "name": "BoardResourceObserverUnavailable: healthy threshold, pending, firing and recovery",
      "interval": "15s",
      "input_series": [
        {
          "series": "up{job=\"board-resource\",instance=\"fixture:5\"}",
          "values": "1x100"
        },
        {
          "series": "board_resource_sample_success{job=\"board-resource\",instance=\"fixture:5\"}",
          "values": "1x3 0x9 1x86"
        },
        {
          "series": "board_resource_sample_last_success_timestamp_seconds{job=\"board-resource\",instance=\"fixture:5\"}",
          "values": "0+15x100"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "45s",
          "alertname": "BoardResourceObserverUnavailable",
          "exp_alerts": []
        },
        {
          "eval_time": "75s",
          "alertname": "BoardResourceObserverUnavailable",
          "exp_alerts": []
        },
        {
          "eval_time": "90s",
          "alertname": "BoardResourceObserverUnavailable",
          "exp_alerts": [
            {
              "exp_labels": {
                "job": "board-resource",
                "instance": "fixture:5",
                "severity": "warning"
              },
              "exp_annotations": {
                "summary": "Resource observer is unavailable or stale"
              }
            }
          ]
        },
        {
          "eval_time": "210s",
          "alertname": "BoardResourceObserverUnavailable",
          "exp_alerts": []
        }
      ],
      "promql_expr_test": [
        {
          "expr": "ALERTS{alertname=\"BoardResourceObserverUnavailable\",alertstate=\"pending\"}",
          "eval_time": "75s",
          "exp_samples": [
            {
              "labels": "{__name__=\"ALERTS\",alertname=\"BoardResourceObserverUnavailable\",alertstate=\"pending\",job=\"board-resource\",instance=\"fixture:5\",severity=\"warning\"}",
              "value": 1
            }
          ]
        }
      ]
    },
