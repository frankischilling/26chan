{
  "rule_files": [
    "../../deploy/monitoring/alerts.yml"
  ],
  "evaluation_interval": "15s",
  "tests": [
    {
      "name": "BoardMediaObserverUnavailable: healthy threshold, pending, firing, recovery",
      "interval": "15s",
      "input_series": [
        {
          "series": "up{job=\"board-monitor\",instance=\"fixture:4\"}",
          "values": "1x20"
        },
        {
          "series": "board_media_sample_success{job=\"board-monitor\",instance=\"fixture:4\"}",
          "values": "1x3 0x7 1x5"
        },
        {
          "series": "board_media_sample_last_success_timestamp_seconds{job=\"board-monitor\",instance=\"fixture:4\"}",
          "values": "0+15x20"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "45s",
          "alertname": "BoardMediaObserverUnavailable",
          "exp_alerts": []
        },
        {
          "eval_time": "75s",
          "alertname": "BoardMediaObserverUnavailable",
          "exp_alerts": []
        },
        {
          "eval_time": "90s",
          "alertname": "BoardMediaObserverUnavailable",
          "exp_alerts": [
            {
              "exp_labels": {
                "job": "board-monitor",
                "instance": "fixture:4",
                "severity": "warning"
              },
              "exp_annotations": {
                "summary": "Media queue observer is unavailable or stale"
              }
            }
          ]
        },
        {
          "eval_time": "180s",
          "alertname": "BoardMediaObserverUnavailable",
          "exp_alerts": []
        }
      ],
      "promql_expr_test": [
        {
          "expr": "ALERTS{alertname=\"BoardMediaObserverUnavailable\",alertstate=\"pending\"}",
          "eval_time": "75s",
          "exp_samples": [
            {
              "labels": "{__name__=\"ALERTS\",alertname=\"BoardMediaObserverUnavailable\",alertstate=\"pending\",instance=\"fixture:4\",job=\"board-monitor\",severity=\"warning\"}",
              "value": 1
            }
          ]
        }
      ]
    },
