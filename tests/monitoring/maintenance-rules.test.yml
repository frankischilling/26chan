{
  "rule_files": [
    "../../deploy/monitoring/alerts.yml"
  ],
  "evaluation_interval": "1s",
  "tests": [
    {
      "name": "Failure persists while a retry runs and clears only after success",
      "interval": "15s",
      "input_series": [
        {
          "series": "up{job=\"board-maintenance\",instance=\"fixture:6\"}",
          "values": "1x100"
        },
        {
          "series": "board_maintenance_sample_success{job=\"board-maintenance\",instance=\"fixture:6\",maintenance=\"application\"}",
          "values": "1x100"
        },
        {
          "series": "board_maintenance_sample_last_success_timestamp_seconds{job=\"board-maintenance\",instance=\"fixture:6\",maintenance=\"application\"}",
          "values": "0+15x100"
        },
        {
          "series": "board_maintenance_run_in_progress{job=\"board-maintenance\",instance=\"fixture:6\",maintenance=\"application\"}",
          "values": "0x7 1x5 0x86"
        },
        {
          "series": "board_maintenance_failure_pending{job=\"board-maintenance\",instance=\"fixture:6\",maintenance=\"application\"}",
          "values": "0x3 1x9 0x86"
        },
        {
          "series": "board_maintenance_run_started_timestamp_seconds{job=\"board-maintenance\",instance=\"fixture:6\",maintenance=\"application\"}",
          "values": "1x100"
        },
        {
          "series": "board_maintenance_last_success_timestamp_seconds{job=\"board-maintenance\",instance=\"fixture:6\",maintenance=\"application\"}",
          "values": "1x100"
        },
        {
          "series": "board_maintenance_max_age_seconds{job=\"board-maintenance\",instance=\"fixture:6\",maintenance=\"application\"}",
          "values": "10000x100"
        },
        {
          "series": "board_maintenance_run_timeout_seconds{job=\"board-maintenance\",instance=\"fixture:6\",maintenance=\"application\"}",
          "values": "60x100"
        }
      ],
      "alert_rule_test": [
        {
          "alertname": "BoardMaintenanceFailed",
          "eval_time": "45s",
          "exp_alerts": []
        },
        {
          "alertname": "BoardMaintenanceFailed",
          "eval_time": "75s",
          "exp_alerts": []
        },
        {
          "alertname": "BoardMaintenanceFailed",
          "eval_time": "90s",
          "exp_alerts": [
            {
              "exp_labels": {
                "job": "board-maintenance",
                "instance": "fixture:6",
                "severity": "warning",
                "maintenance": "application"
              },
              "exp_annotations": {
                "summary": "Maintenance command failure remains unresolved"
              }
            }
          ]
        },
        {
          "alertname": "BoardMaintenanceFailed",
          "eval_time": "165s",
          "exp_alerts": [
            {
              "exp_labels": {
                "job": "board-maintenance",
                "instance": "fixture:6",
                "severity": "warning",
                "maintenance": "application"
              },
              "exp_annotations": {
                "summary": "Maintenance command failure remains unresolved"
              }
            }
          ]
        },
        {
          "alertname": "BoardMaintenanceFailed",
          "eval_time": "210s",
          "exp_alerts": []
        }
      ],
      "promql_expr_test": [
        {
          "expr": "ALERTS{alertname=\"BoardMaintenanceFailed\",alertstate=\"pending\"}",
          "eval_time": "75s",
          "exp_samples": [
            {
              "labels": "{__name__=\"ALERTS\",alertname=\"BoardMaintenanceFailed\",alertstate=\"pending\",job=\"board-maintenance\",instance=\"fixture:6\",severity=\"warning\",maintenance=\"application\"}",
              "value": 1
            }
