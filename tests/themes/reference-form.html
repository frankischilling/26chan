<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Synthetic posting form reference</title>
<body><form><table class="postForm" id="postForm" style="display:table"><tbody>
<tr><td>Name</td><td><input name="name" type="text"></td></tr>
<tr><td>Options</td><td><input name="email" type="text"></td></tr>
<tr><td>Subject</td><td><input name="sub" type="text"><input type="submit" value="Post"></td></tr>
<tr><td>Comment</td><td><textarea name="com" cols="48" rows="4"></textarea></td></tr>
<tr><td>File</td><td><input name="upfile" type="file"></td></tr>
</tbody></table></form></body></html>
