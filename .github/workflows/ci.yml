name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust-and-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.14.0'
          package-manager-cache: false
      - name: Install pinned Rust and PostgreSQL
        run: |
          rustup toolchain install 1.94.0 --profile minimal --component rustfmt --component clippy
          test -f /etc/apt/sources.list.d/ubuntu.sources
          sudo install -m 0644 scripts/ci-ubuntu-sources.conf /etc/apt/apt.conf.d/99board-ci-sources
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-client-16 perl make gcc iproute2 util-linux
      - name: Start disposable database and migrate
        run: |
          sudo bash scripts/test-role-bootstrap.sh
          sudo bash scripts/dev-db.sh
          sudo bash scripts/dev-media-db.sh
          sudo bash scripts/dev-media-reader-db.sh
          sudo bash scripts/dev-staff-db.sh
          sudo chown -R "$(id -u):$(id -g)" .local
          source .local/database.env
          cargo run -p board-store --bin board-migrate --locked
          bash scripts/seed.sh
      - name: Rust, database permissions, concurrency, and browser behavior
        run: |
          source .local/database.env
          source .local/media.env
          source .local/media-reader.env
          source .local/staff.env
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          bash scripts/verify.sh
      - name: Upgrade existing staff sessions from migration 0005
        run: sudo bash scripts/test-staff-idle-migration.sh
      - name: Build and qualify a disposable media guest on the owned runner
        run: |
          uname -r
          systemctl --version
          stat --file-system --format='cgroup filesystem: %T' /sys/fs/cgroup
          rustup target add x86_64-unknown-linux-musl --toolchain 1.94.0
          export CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=rust-lld
          cargo build -p board-media-guest --bins --example containment-probe --target x86_64-unknown-linux-musl --locked
          python3 -m unittest discover -s tests/media -p test_runner.py
          sudo env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin python3 scripts/media/provision-test.py /tmp/26chan-media-ci "$PWD/target/x86_64-unknown-linux-musl/debug"
          sudo env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin \
            MEDIA_VM_TEST_CONFIG=/tmp/26chan-media-ci/decode.json \
            MEDIA_VM_PROBE_CONFIG=/tmp/26chan-media-ci/probe.json \
            MEDIA_VM_VALIDATOR="$PWD/target/debug/media-validate" \
            python3 tests/media/test_vm.py -v
          sudo env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin \
            MEDIA_VM_PROBE_CONFIG=/tmp/26chan-media-ci/probe.json \
            python3 tests/media/test_boundaries.py
          sudo env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin \
            MEDIA_VM_PROBE_CONFIG=/tmp/26chan-media-ci/probe.json \
            python3 tests/media/test_recovery.py -v
          sudo env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin \
            MEDIA_VM_TEST_CONFIG=/tmp/26chan-media-ci/decode.json \
            bash scripts/test-media-publication.sh
      - name: Upgrade existing comments from migration 0006
        run: sudo bash scripts/test-comment-migration.sh
      - name: Upgrade legacy media receipts without automatic approval
        run: sudo bash scripts/test-media-approval-migration.sh
      - name: Restore disposable backup
        run: sudo bash scripts/restore-exercise.sh
  visual-windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.14.0'
          package-manager-cache: false
      - name: Install toolchain and browser
        shell: pwsh
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          npm ci --ignore-scripts
          npx playwright install chromium
      - name: Build visual fixture before the server startup deadline
        shell: pwsh
        run: cargo build -p board-public --example visual-fixtures --locked
      - name: Run deterministic visual fixture without a database service
        shell: pwsh
        run: |
          $env:VISUAL_FIXTURE_SERVER = '1'
          npm run test:visual
