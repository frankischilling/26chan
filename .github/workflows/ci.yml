name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust-and-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.14.0'
          package-manager-cache: false
      - name: Install pinned Rust and PostgreSQL
        run: |
          rustup toolchain install 1.94.0 --profile minimal --component rustfmt --component clippy
          test -f /etc/apt/sources.list.d/ubuntu.sources
          sudo install -m 0644 scripts/ci-ubuntu-sources.conf /etc/apt/apt.conf.d/99board-ci-sources
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-client-16 perl make gcc iproute2 util-linux openssl
      - name: Start disposable database and migrate
        run: |
          sudo bash scripts/test-role-bootstrap.sh
          sudo bash scripts/dev-db.sh
          sudo bash scripts/dev-media-db.sh
          sudo bash scripts/dev-media-reader-db.sh
          sudo bash scripts/dev-intake-db.sh
          sudo bash scripts/dev-monitor-db.sh
          sudo bash scripts/dev-staff-db.sh
          sudo chown -R "$(id -u):$(id -g)" .local
          source .local/database.env
          cargo run -p board-store --bin board-migrate --locked
          bash scripts/seed.sh
      - name: Rust, database permissions, concurrency, and browser behavior
        run: |
          source .local/database.env
          source .local/media.env
          source .local/media-reader.env
          source .local/intake.env
          source .local/monitor.env
          source .local/staff.env
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          bash scripts/verify.sh
      - name: Upgrade existing staff sessions from migration 0005
        run: sudo bash scripts/test-staff-idle-migration.sh
      - name: Build and qualify a disposable media guest on the owned runner
        run: |
          uname -r
          systemctl --version
          stat --file-system --format='cgroup filesystem: %T' /sys/fs/cgroup
          rustup target add x86_64-unknown-linux-musl --toolchain 1.94.0
          export CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=rust-lld
          cargo build -p board-media-guest --bins --example containment-probe --target x86_64-unknown-linux-musl --locked
          python3 -m unittest discover -s tests/media -p test_runner.py
          sudo env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin python3 scripts/media/provision-test.py /tmp/26chan-media-ci "$PWD/target/x86_64-unknown-linux-musl/debug"
          sudo env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin \
            MEDIA_VM_TEST_CONFIG=/tmp/26chan-media-ci/decode.json \
            MEDIA_VM_PROBE_CONFIG=/tmp/26chan-media-ci/probe.json \
            MEDIA_VM_VALIDATOR="$PWD/target/debug/media-validate" \
            python3 tests/media/test_vm.py -v
          sudo env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin \
            MEDIA_VM_PROBE_CONFIG=/tmp/26chan-media-ci/probe.json \
            python3 tests/media/test_boundaries.py
          sudo env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin \
            MEDIA_VM_PROBE_CONFIG=/tmp/26chan-media-ci/probe.json \
            python3 tests/media/test_recovery.py -v
          sudo env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin \
            MEDIA_VM_TEST_CONFIG=/tmp/26chan-media-ci/decode.json \
            bash scripts/test-media-publication.sh
      - name: Qualify authenticated media dispatch and native service boundaries
        run: |
          sudo env MEDIA_DISPATCH_ROOT_TESTS=1 CARGO_HOME="$HOME/.cargo" RUSTUP_HOME="$HOME/.rustup" \
            "$HOME/.cargo/bin/cargo" test -p board-media-dispatch --all-targets --locked
          sudo env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin \
            MEDIA_VM_TEST_CONFIG=/tmp/26chan-media-ci/decode.json \
            MEDIA_VM_PROBE_CONFIG=/tmp/26chan-media-ci/probe.json \
            bash scripts/test-media-dispatch.sh
          sudo env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin \
            MEDIA_VM_TEST_CONFIG=/tmp/26chan-media-ci/decode.json \
            MEDIA_VM_PROBE_CONFIG=/tmp/26chan-media-ci/probe.json \
            bash scripts/test-media-dispatch.sh --systemd
          sudo env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin \
            MEDIA_VM_TEST_CONFIG=/tmp/26chan-media-ci/decode.json \
            MEDIA_VM_PROBE_CONFIG=/tmp/26chan-media-ci/probe.json \
            bash scripts/test-media-dispatch.sh --http
          sudo env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin \
            MEDIA_DISPATCH_ROOT_TESTS=1 \
            MEDIA_VM_TEST_CONFIG=/tmp/26chan-media-ci/decode.json \
            MEDIA_VM_PROBE_CONFIG=/tmp/26chan-media-ci/probe.json \
            python3 tests/media/test_dispatch_broker.py -v
          systemd-analyze verify deploy/media-dispatch-broker.service deploy/media-dispatch-gateway.service
      - name: Qualify authenticated HTTP intake through isolated processing and the separate reader
        run: |
          sudo env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin \
            PUBLIC_UPLOAD_NODE="$(command -v node)" \
            MEDIA_VM_TEST_CONFIG=/tmp/26chan-media-ci/decode.json \
            MEDIA_VM_PROBE_CONFIG=/tmp/26chan-media-ci/probe.json \
            bash scripts/test-media-intake.sh
          sudo env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin \
            PUBLIC_UPLOAD_NODE="$(command -v node)" \
            MEDIA_VM_TEST_CONFIG=/tmp/26chan-media-ci/decode.json \
            MEDIA_VM_PROBE_CONFIG=/tmp/26chan-media-ci/probe.json \
            bash scripts/test-media-intake.sh --interrupt
      - name: Upgrade existing comments from migration 0006
        run: sudo bash scripts/test-comment-migration.sh
      - name: Upgrade existing threads from migration 0008
        run: sudo bash scripts/test-archive-migration.sh
      - name: Upgrade legacy media receipts without automatic approval
        run: sudo bash scripts/test-media-approval-migration.sh
      - name: Upgrade existing media jobs to capability-scoped intake
        run: sudo bash scripts/test-media-intake-migration.sh
      - name: Restore disposable backup
        run: sudo bash scripts/restore-exercise.sh
      - name: Restore populated attachments and normalized files
        run: sudo bash scripts/test-attachment-restore.sh
      - name: Qualify aggregate observer and real queue alert delivery
        run: |
          sudo install -D -m 0755 target/debug/board-monitor /opt/paperboard/board-monitor
          systemd-analyze verify deploy/monitor.service
          python3 scripts/monitoring/download.py
          sudo env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin \
            bash scripts/test-queue-monitoring.sh "$PWD/target/debug/board-monitor" \
            "$PWD/target/debug/examples/queue_fixture" "$PWD/.local/monitoring/bin"
          sudo env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin QUEUE_QUALIFICATION_INTERRUPT=1 \
            bash scripts/test-queue-monitoring.sh "$PWD/target/debug/board-monitor" \
            "$PWD/target/debug/examples/queue_fixture" "$PWD/.local/monitoring/bin"
      - name: Qualify storage and service pressure through authenticated monitoring
        run: |
          sudo install -D -m 0755 target/debug/board-resource-monitor /opt/paperboard/board-resource-monitor
          systemd-analyze verify deploy/resource-monitor.service
          python3 -m venv .local/monitor-auth-venv
          .local/monitor-auth-venv/bin/python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r scripts/monitoring/auth-requirements.txt
          sudo env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin \
            RESOURCE_QUALIFICATION_PYTHON="$PWD/.local/monitor-auth-venv/bin/python" \
            bash scripts/test-resource-monitoring.sh "$PWD/target/debug/board-resource-monitor" "$PWD/.local/monitoring/bin"
          sudo env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin RESOURCE_QUALIFICATION_INTERRUPT=1 \
            RESOURCE_QUALIFICATION_PYTHON="$PWD/.local/monitor-auth-venv/bin/python" \
            bash scripts/test-resource-monitoring.sh "$PWD/target/debug/board-resource-monitor" "$PWD/.local/monitoring/bin"
      - name: Qualify actual maintenance outcomes and authenticated alert delivery
        run: |
          python3 -m unittest discover -s tests/maintenance -p 'test_*.py' -v
          sudo install -D -m 0755 target/debug/board-maintenance-monitor /opt/paperboard/board-maintenance-monitor
          sudo install -D -m 0644 scripts/maintenance/run.py /opt/paperboard/maintenance/run.py
          sudo install -D -m 0644 scripts/maintenance/state.py /opt/paperboard/maintenance/state.py
          systemd-analyze verify deploy/maintenance-monitor.service deploy/maintenance@.service deploy/maintenance@.timer
          sudo env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin \
            MAINTENANCE_QUALIFICATION_PYTHON="$PWD/.local/monitor-auth-venv/bin/python" \
            bash scripts/test-maintenance-monitoring.sh "$PWD/target/debug/board-maintenance-monitor" "$PWD/.local/monitoring/bin"
          sudo env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin MAINTENANCE_QUALIFICATION_INTERRUPT=1 \
            MAINTENANCE_QUALIFICATION_PYTHON="$PWD/.local/monitor-auth-venv/bin/python" \
            bash scripts/test-maintenance-monitoring.sh "$PWD/target/debug/board-maintenance-monitor" "$PWD/.local/monitoring/bin"
  visual-windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.14.0'
          package-manager-cache: false
      - name: Install toolchain and browser
        shell: pwsh
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          npm ci --ignore-scripts
          npx playwright install chromium
      - name: Build visual fixture before the server startup deadline
        shell: pwsh
        run: cargo build -p board-public --example visual-fixtures --locked
      - name: Run deterministic visual fixture without a database service
        shell: pwsh
        run: |
          $env:VISUAL_FIXTURE_SERVER = '1'
          npm run test:visual
      - name: Run archive desktop and mobile visual fixtures
        shell: pwsh
        run: npm run test:archive-visual
