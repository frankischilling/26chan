name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust-and-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.14.0'
          package-manager-cache: false
      - name: Install pinned Rust and PostgreSQL
        run: |
          rustup toolchain install 1.94.0 --profile minimal --component rustfmt --component clippy
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-client-16 perl make gcc
      - name: Start disposable database and migrate
        run: |
          sudo bash scripts/dev-db.sh
          sudo bash scripts/dev-media-db.sh
          sudo bash scripts/dev-staff-db.sh
          sudo chown -R "$(id -u):$(id -g)" .local
          source .local/database.env
          cargo run -p board-store --bin board-migrate --locked
          bash scripts/seed.sh
      - name: Rust, database permissions, concurrency, and browser behavior
        run: |
          source .local/database.env
          source .local/media.env
          source .local/staff.env
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          bash scripts/verify.sh
      - name: Restore disposable backup
        run: sudo bash scripts/restore-exercise.sh
  visual-windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.14.0'
          package-manager-cache: false
      - name: Install toolchain and browser
        shell: pwsh
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          npm ci --ignore-scripts
          npx playwright install chromium
      - name: Build visual fixture before the server startup deadline
        shell: pwsh
        run: cargo build -p board-public --example visual-fixtures --locked
      - name: Run deterministic visual fixture without a database service
        shell: pwsh
        run: |
          $env:VISUAL_FIXTURE_SERVER = '1'
          npm run test:visual
