name: Windows browser failure control
on:
  pull_request:
    paths:
      - '.github/workflows/windows-browser-control.yml'
      - 'scripts/windows-browser-control*'
      - 'scripts/check-windows-browser-control.mjs'
      - 'tests/helpers/windows-browser-control*'
      - 'tests/helpers/browser-control-trigger*'
      - 'tests/helpers/visual-diagnostics.js'
      - 'tests/helpers/visual-netlog.js'
      - 'tests/fixtures/windows-dual-stack-connect-probe/owned-process*'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  browser-failure-control:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      WINDOWS_BROWSER_CONTROL: '1'
      WINDOWS_VISUAL_RESOURCE_DIAGNOSTICS: '1'
      WINDOWS_VISUAL_NETLOG: '1'
      THEME_SHARD: '7'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify candidate identity
        timeout-minutes: 1
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $head=git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $head -ne $env:CANDIDATE_SHA) { throw 'Candidate head mismatch.' }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        timeout-minutes: 2
        with:
          node-version: '24.14.0'
          package-manager-cache: false
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install pinned Rust
        timeout-minutes: 3
        shell: pwsh
        run: rustup toolchain install 1.94.0 --profile minimal
      - name: Install pinned Unicode normalization runtime
        timeout-minutes: 3
        shell: pwsh
        run: ./scripts/install-windows-icu.ps1
      - name: Restore Rust dependencies
        timeout-minutes: 2
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: windows-2025-${{ hashFiles('Cargo.toml') }}-visual-windows
          cache-bin: false
          cache-all-crates: false
          cache-workspace-crates: false
          save-if: false
      - name: Install pinned browser dependencies
        timeout-minutes: 4
        shell: pwsh
        run: |
          npm ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx playwright install chromium
      - name: Verify control evidence and rejection paths
        timeout-minutes: 2
        shell: pwsh
        run: node --test tests/helpers/windows-browser-control.test.mjs
      - name: Verify exact original shard coverage
        timeout-minutes: 2
        shell: pwsh
        run: node scripts/check-windows-theme-shards.mjs
      - name: Verify process-tree containment
        timeout-minutes: 1
        shell: pwsh
        run: ./tests/fixtures/windows-dual-stack-connect-probe/owned-process.test.ps1
      - name: Build visual fixture before the original startup deadline
        timeout-minutes: 9
        shell: pwsh
        run: cargo +1.94.0 build -p board-public --example visual-fixtures --locked
      - name: Run original shard with one isolated browser control
        timeout-minutes: 20
        shell: pwsh
        run: |
          ./scripts/windows-visual-resources.ps1 -Phase before-control
          ./scripts/windows-browser-control.ps1
          exit $LASTEXITCODE
      - name: Verify bounded control qualification separately
        if: always()
        timeout-minutes: 1
        shell: pwsh
        run: node scripts/check-windows-browser-control.mjs
      - name: Retain admitted control evidence
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-control-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/windows-browser-control-7/summary.json
            test-results/windows-browser-control-7/control-netlog.json
            test-results/windows-browser-control-7/ownership.json
          if-no-files-found: warn
          retention-days: 3
          compression-level: 0
          include-hidden-files: false
      - name: Retain original shard failure evidence
        if: failure()
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-control-original-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/windows-themes-7/**/*.png
            test-results/windows-themes-7/**/trace.zip
            test-results/windows-themes-7/**/error-context.md
            test-results/windows-themes-7/netlogs/*.json
          if-no-files-found: ignore
          retention-days: 3
          compression-level: 0
          include-hidden-files: false
      - name: Retain original bounded transport diagnostics
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-control-original-transport-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/windows-themes-7/transport-stderr.json
            test-results/windows-themes-7/fixture-lifecycle.json
          if-no-files-found: ignore
          retention-days: 3
          compression-level: 0
          include-hidden-files: false
      - name: Record final resource aggregates
        timeout-minutes: 1
        if: always()
        shell: pwsh
        run: ./scripts/windows-visual-resources.ps1 -Phase after-control
