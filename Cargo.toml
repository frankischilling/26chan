[workspace]
members = ["crates/domain", "crates/config", "crates/store", "crates/media", "crates/media-dispatch", "crates/http", "crates/observe", "apps/public", "apps/media-admin", "apps/staff", "apps/media-guest", "apps/media-http", "apps/media-intake", "apps/monitor", "apps/resource-monitor", "apps/maintenance-monitor"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace.dependencies]
askama = "=0.16.1"
axum = "=0.8.9"
bytes = "=1.12.1"
http-body = "=1.1.0"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "derive", "migrate", "macros", "chrono"] }
tokio = { version = "1.50", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
url = "2.5"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
proptest = "1.10"
futures-util = "=0.3.34"
tokio-util = { version = "=0.7.19", features = ["io"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
strip = "debuginfo"
