[package]
name = "board-media-dispatch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
tokio = { workspace = true, features = ["io-util"] }
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["ring"] }
rustls = { version = "=0.23.44", default-features = false, features = ["ring", "std"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.4", features = ["fs", "process"] }

[dev-dependencies]
tempfile = "=3.27.0"
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "ring", "pem"] }
proptest.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
