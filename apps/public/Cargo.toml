[package]
name = "board-public"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
database-tests = ["board-store/database-tests"]
browser-tests = ["database-tests"]

[dependencies]
board-media = { path = "../../crates/media" }
board-domain = { path = "../../crates/domain" }
board-config = { path = "../../crates/config" }
board-store = { path = "../../crates/store" }
board-http = { path = "../../crates/http" }
board-intake-client = { path = "../../crates/intake-client" }
board-observe = { path = "../../crates/observe" }
askama.workspace = true
axum = { workspace = true, features = ["multipart"] }
futures-util.workspace = true
tokio-util.workspace = true
bytes.workspace = true
sqlx.workspace = true
chrono.workspace = true
tokio = { workspace = true, features = ["io-util"] }
serde.workspace = true
serde_json.workspace = true
url.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
httpdate = "1.0"
chrono-tz = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.4", features = ["process"] }

[dev-dependencies]
# Fixture-only HTTP connection ownership; versions already locked transitively.
hyper = { version = "=1.11.1", features = ["http1", "server"] }
hyper-util = { version = "=0.1.20", features = ["tokio", "service"] }
tokio = { workspace = true, features = ["process", "io-util", "test-util"] }
board-media-admin = { path = "../media-admin" }
board-media-http = { path = "../media-http" }
board-media-intake = { path = "../media-intake" }
tempfile = "3.27"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
proptest.workspace = true
roxmltree = "=0.21.1"

[lints]
workspace = true

# This executable is a disposable browser-test authority, never a runtime tool.
[[example]]
name = "deletion-quota-fixture"
required-features = ["browser-tests"]

[[example]]
name = "math-browser-fixture"
required-features = ["browser-tests"]
