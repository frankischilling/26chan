[package]
name = "board-public"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
database-tests = ["board-store/database-tests"]
browser-tests = ["database-tests"]

[dependencies]
board-domain = { path = "../../crates/domain" }
board-config = { path = "../../crates/config" }
board-store = { path = "../../crates/store" }
board-http = { path = "../../crates/http" }
board-observe = { path = "../../crates/observe" }
askama.workspace = true
axum = { workspace = true, features = ["multipart"] }
hyper = { version = "=1.11.1", features = ["client", "http1"] }
hyper-util = { version = "=0.1.20", features = ["tokio"] }
futures-util.workspace = true
bytes.workspace = true
sqlx.workspace = true
chrono.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
httpdate = "1.0"
chrono-tz = "0.10"

[dev-dependencies]
tokio = { workspace = true, features = ["process", "io-util"] }
board-media-admin = { path = "../media-admin" }
board-media-http = { path = "../media-http" }
board-media-intake = { path = "../media-intake" }
board-media = { path = "../../crates/media" }
tempfile = "3.27"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
proptest.workspace = true

[lints]
workspace = true
