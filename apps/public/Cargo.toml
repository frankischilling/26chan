[features]
database-tests = ["board-store/database-tests"]

[dependencies]
board-domain = { path = "../../crates/domain" }
board-config = { path = "../../crates/config" }
board-store = { path = "../../crates/store" }
askama.workspace = true
axum.workspace = true
sqlx.workspace = true
chrono.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
httpdate = "1.0"
chrono-tz = "0.10"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
proptest.workspace = true

[lints]
workspace = true
