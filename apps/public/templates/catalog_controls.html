<form id="ctrl" class="catalogControls" action="/{{ board.slug }}/catalog" method="get" aria-label="Catalog controls" data-media-origin="{{ media_origin }}">
<div id="info"><span id="search-label">Search: <span id="search-term"></span></span></div>
<hr class="mobile">
<div id="settings" class="mobilebtn">
<span class="catalogControl"><label for="order-ctrl">Sort by:</label>
<select id="order-ctrl" name="order">
<option value="alt"{% if catalog_options.order_value() == "alt" %} selected{% endif %}>Bump order</option>
<option value="absdate"{% if catalog_options.order_value() == "absdate" %} selected{% endif %}>Last reply</option>
<option value="date"{% if catalog_options.order_value() == "date" %} selected{% endif %}>Creation date</option>
<option value="r"{% if catalog_options.order_value() == "r" %} selected{% endif %}>Reply count</option>
</select></span>
<span class="catalogControl"{% if board.text_only %} hidden{% endif %}><label for="size-ctrl">Image size:</label>
<select id="size-ctrl" name="size"><option value="small"{% if !catalog_options.large() %} selected{% endif %}>Small</option><option value="large"{% if catalog_options.large() %} selected{% endif %}>Large</option></select></span>
<span class="catalogControl"{% if board.text_only %} hidden{% endif %}><label for="teaser-ctrl">Teasers:</label>
<select id="teaser-ctrl" name="teaser"><option value="off"{% if !catalog_options.show_teaser() %} selected{% endif %}>Off</option><option value="on"{% if catalog_options.show_teaser() %} selected{% endif %}>On</option></select></span>
<span class="btn-wrap"><button id="filters-ctrl" type="button" class="button" hidden aria-haspopup="dialog">Filters</button></span>
<span class="btn-wrap"><button id="qf-ctrl" type="button" class="button" hidden aria-controls="qf-cnt" aria-expanded="false">Search</button></span><span id="qf-cnt"><label for="qf-box" class="catalogSearchFallback">Search:</label><input id="qf-box" type="text" name="q" value="{{ catalog_options.q }}" aria-label="Search" aria-describedby="catalog-search-help"><button id="qf-clear" type="button" class="button" hidden aria-label="Close catalog Search">×</button></span>
<span class="catalogControl"{% if board.text_only %} hidden{% endif %}><label for="catalog-spoilers">Spoilers:</label><select id="catalog-spoilers" name="spoilers"><option value="off"{% if !catalog_options.reveal_spoilers() %} selected{% endif %}>Hidden</option><option value="on"{% if catalog_options.reveal_spoilers() %} selected{% endif %}>Reveal</option></select></span>
<span class="catalogControl"><button type="submit" class="catalogApplyFallback">Apply</button> <a id="catalog-reset" href="/{{ board.slug }}/catalog">Reset</a></span>
<small id="catalog-preference-status" role="status" hidden></small>
</div><div class="clear"></div>
</form>
<span id="catalog-search-help" hidden>Search accepts up to 128 characters.</span>
<script type="module" src="/static/catalog-preferences.v1.js"></script>
