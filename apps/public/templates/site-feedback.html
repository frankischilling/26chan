<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Feedback - 4chan</title></head>
<body><header><h1 id="title">4chan Feedback</h1></header><section id="content">
{% if let Some(error) = error %}<div class="feedback error">{{ error }}</div>
{% else if sent %}<div class="feedback success">Your feedback has been submitted.</div>
{% else if let Some(profile) = profile %}
<div id="form"><h2>Submit Feedback</h2>
<form method="post" action="/feedback" enctype="multipart/form-data">
<div class="form-col"><label for="form-cat">Category:</label><select name="category" id="form-cat">
{% for category in profile.form.categories %}<option value="{{ category.id }}">{{ category.label }}</option>{% endfor %}
</select></div>
<label for="form-subject">Subject:</label><input maxlength="{{ profile.form.subject_limit }}" type="text" name="subject" id="form-subject" required>
<label for="form-message">Message:</label><textarea maxlength="{{ profile.form.message_limit }}" name="message" rows="8" cols="40" id="form-message" required></textarea>
<div id="captcha-cnt"><label for="feedback-answer">Verification:</label><img src="data:image/png;base64,{{ image }}" alt="Verification challenge"><input id="feedback-answer" name="answer" autocomplete="off" maxlength="64" required></div>
<button type="submit" id="form-submit">Submit</button><input type="hidden" name="action" value="submit">
<input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="profile" value="{{ profile.id }}"><input type="hidden" name="challenge" value="{{ token }}">
</form></div>{% endif %}</section>
<footer><a href="/faq#what4chan">About</a> &bull; <a href="/feedback">Feedback</a> &bull; <a href="/legal">Legal</a> &bull; <a href="/contact">Contact</a></footer>
</body></html>
