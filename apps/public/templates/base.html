<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Paperboard{% endblock %}</title>
  {% block favicon %}<link rel="shortcut icon" type="image/x-icon" href="/static/notifications/favicon.ico">{% endblock %}
  <link rel="stylesheet" href="/static/board.css">
  {% block theme_stylesheet %}<link rel="stylesheet" href="/static/theme.css">{% endblock %}
</head>
<body{% block body_attributes %}{% endblock %}>
<nav class="boardList" aria-label="Board navigation">[ <a href="/">All boards</a> ]</nav>
<main id="content">{% block content %}{% endblock %}</main>
<footer><p>{% block theme_link %}<a href="/settings/theme">Style</a>{% endblock %}</p><p>Paperboard development build. {% block feature_notice %}Text posts only.{% endblock %}</p></footer>
</body>
</html>
