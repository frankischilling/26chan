{% extends "poll-base.html" %}
{% block content %}
<div class="poll-cnt" aria-labelledby="poll-title">
<h3 class="poll-hdr" id="poll-title">{{ title }}</h3>
{% if !description.is_empty() %}<div id="poll-desc">{{ description }}</div>{% endif %}
<table id="entries" class="poll-res-tbl pollResults">
<tbody>
{% for option in options %}<tr><th>{{ option.percentage }}% ({{ option.score }})</th><td>{{ option.caption }}</td></tr>
{% endfor %}
<tr class="poll-res-total"><td></td><td class="pollTotal">Total votes: {{ vote_count }}</td></tr>
</tbody>
</table>
<a class="back-link" href="/polls/{{ id }}">Back to Options</a>
</div>
{% endblock %}
