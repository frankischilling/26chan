<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% if success %}Report received{% else %}Report could not be completed{% endif %}</title><link rel="stylesheet" href="/static/board.css"><script type="module" src="/static/report-popup.v1.js"></script></head>
<body id="report-popup-context" data-board="{{ board }}"{% if no > 0 %} data-post="{{ no }}"{% endif %} data-result="{% if success %}success{% else %}error{% endif %}"><main><h1>{% if success %}Report received{% else %}Report could not be completed{% endif %}</h1><p>{{ message }}</p>
<p><a id="report-popup-return" href="/{{ board }}/">Return to board</a> <button id="report-popup-close" type="button" hidden>Close window</button></p></main></body></html>
