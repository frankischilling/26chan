<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Pass - PIN recovery</title><link rel="stylesheet" href="/static/pass-auth.v1.css"></head><body><header><h1 id="title">Pass</h1></header><main id="content"><h2>PIN recovery</h2>{% if !message.is_empty() %}<p role="status">{{ message }}</p>{% endif %}
{% if mode == "request" %}<form action="/pass" method="post"><input type="hidden" name="action" value="request"><input type="hidden" name="csrf" value="{{ csrf }}"><p><label for="recovery-id">Token</label><br><input id="recovery-id" name="id" type="text" maxlength="10" autocomplete="username" required></p><p><label for="recovery-email">Owner email</label><br><input id="recovery-email" name="email" type="email" maxlength="254" autocomplete="email" required></p><button type="submit">Send recovery link</button></form>
{% else if mode == "reset" %}<form action="/pass" method="post"><input type="hidden" name="action" value="complete"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="token" value="{{ token }}"><p><label for="recovery-pin">New PIN</label><br><input id="recovery-pin" name="pin" type="password" maxlength="128" autocomplete="new-password" required></p><p><label for="recovery-confirm">Confirm PIN</label><br><input id="recovery-confirm" name="confirm" type="password" maxlength="128" autocomplete="new-password" required></p><button type="submit">Change PIN</button></form>{% endif %}<p><a href="/auth">Sign in</a> · <a href="/pass?reset">Request a new link</a></p></main></body></html>
