{% import "formatting.html" as formatting %}
{% macro preview(item, view, board, teaser) %}
<template class="catalogPreview"><div data-created-at="{{ item.post.created_at.timestamp() }}">{% if !board.text_only && !item.post.subject.is_empty() %}<span class="post-subject">{{ item.post.subject }}</span>{% else %}Posted{% endif %} by <span class="{% if let Some(badge) = item.catalog_badge() %}{{ badge.code }}-capcode {% endif %}post-author">{% if !item.catalog_identity_visible(board) || item.post.name.is_empty() %}Anonymous{% else %}{{ item.post.name }}{% endif %}{% if item.catalog_identity_visible(board) %}{% if let Some(trip) = item.post.trip %} <span class="post-tripcode">{{ trip }}</span>{% endif %}{% endif %}{% if let Some(badge) = item.catalog_badge() %} ## {{ badge.label }}{% endif %}</span> {% if let Some(class) = item.catalog_country_class(board) %}<div class="{{ class }}"></div> {% endif %}<span class="post-ago"></span><span class="post-page"></span>{% if board.text_only || !teaser.serialized.is_empty() %}<p class="post-teaser">{% call formatting::comment(teaser.lines.as_slice(), board.slug) %}{% endcall %}</p>{% endif %}{% if let Some(reply) = view.catalog_last_reply %}<div class="post-last" data-created-at="{{ reply.created_at.timestamp() }}" data-reply-id="{{ reply.id }}">Last reply by <span class="{% if let Some(badge) = view.catalog_reply_badge() %}{{ badge.code }}-capcode {% endif %}post-author">{% if !view.catalog_reply_identity_visible(board) %}Anonymous{% else %}{{ reply.name }}{% endif %}{% if view.catalog_reply_identity_visible(board) %}{% if let Some(trip) = reply.trip %} <span class="post-tripcode">{{ trip }}</span>{% endif %}{% endif %}{% if let Some(badge) = view.catalog_reply_badge() %} ## {{ badge.label }}{% endif %}</span> <span class="post-ago"></span></div>{% endif %}</div></template>
{% endmacro %}
