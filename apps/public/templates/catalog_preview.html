{% import "formatting.html" as formatting %}
{% macro preview(item, view, board, teaser) %}
<template class="catalogPreview"><div data-created-at="{{ item.post.created_at.timestamp() }}">{% if !board.text_only && !item.post.subject.is_empty() %}<span class="post-subject">{{ item.post.subject }}</span>{% else %}Posted{% endif %} by <span class="post-author">{% if board.forced_anon || item.post.name.is_empty() %}Anonymous{% else %}{{ item.post.name }}{% endif %}</span> <span class="post-ago"></span><span class="post-page"></span>{% if board.text_only || !teaser.serialized.is_empty() %}<p class="post-teaser">{% call formatting::comment(teaser.lines.as_slice(), board.slug) %}{% endcall %}</p>{% endif %}{% if let Some(reply) = view.catalog_last_reply %}<div class="post-last" data-created-at="{{ reply.created_at.timestamp() }}" data-reply-id="{{ reply.id }}">Last reply by <span class="post-author">{% if board.forced_anon || reply.name.is_empty() %}Anonymous{% else %}{{ reply.name }}{% endif %}</span> <span class="post-ago"></span></div>{% endif %}</div></template>
{% endmacro %}
