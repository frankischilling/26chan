<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Pass - Authenticate</title><link rel="stylesheet" href="/static/pass-auth.v1.css"></head><body><header><h1 id="title">Pass</h1></header><main id="content"><div id="auth-cnt">
{% if status == 0 %}<form id="auth-form" action="/auth" method="post"><fieldset id="auth-fields"><input type="hidden" name="csrf" value="{{ csrf }}"><table><tbody><tr><th><label for="field-id">Token</label></th><td><input id="field-id" name="id" type="text" maxlength="10" autocomplete="username" required></td></tr><tr><th><label for="field-pin">PIN</label></th><td><input id="field-pin" name="pin" type="password" maxlength="128" autocomplete="current-password" required></td></tr></tbody><tfoot><tr class="row-space"><td colspan="2"><input id="field-long-login" name="long_login" type="checkbox" value="1"><label for="field-long-login">Remember this device for 1 year</label></td></tr><tr class="row-space"><td colspan="2"><button id="auth-btn" type="submit">Submit</button></td></tr></tfoot></table></fieldset></form>
{% else if status == 2 %}<h2 class="msg-success">You are authenticated.</h2><form id="logout-form" action="/auth" method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><button id="logout-btn" name="logout" value="1" type="submit">Logout</button></form>
{% else if status == 1 %}<h2 class="msg-success">Success! Your device is now authorized.</h2><p><a href="/auth">Manage authentication</a></p>
{% else if status == 4 %}<h2 class="msg-success">You are now logged out.</h2><p><a href="/auth">Return</a></p>
{% else %}<h2 class="msg-error" role="alert">{{ message }}</h2><p><a href="/auth">Return</a></p>{% endif %}
</div></main></body></html>
