[package]
name = "board-staff"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
database-tests = []

[dependencies]
board-intake-client = { path = "../../crates/intake-client" }
bytes.workspace = true
futures-util.workspace = true
board-domain = { path = "../../crates/domain" }
board-store = { path = "../../crates/store" }
board-config = { path = "../../crates/config" }
board-http = { path = "../../crates/http" }
board-observe = { path = "../../crates/observe" }
askama.workspace = true
axum = { workspace = true, features = ["multipart"] }
sqlx.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
chrono-tz = "0.10"
url.workspace = true
thiserror.workspace = true
webauthn-rs = { version = "=0.5.5", features = ["danger-allow-state-serialisation"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
argon2 = "0.5"
openssl = { version = "0.10", features = ["vendored"] }

[dev-dependencies]
tokio = { workspace = true, features = ["process"] }
board-media-intake = { path = "../media-intake" }
tempfile = "3.27"
board-public = { path = "../public" }
board-media = { path = "../../crates/media" }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints]
workspace = true
