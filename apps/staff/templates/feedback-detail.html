<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Feedback - 4chan</title><link rel="stylesheet" href="/feedback-native.css"><link rel="shortcut icon" href="/staff-assets/favicon-team.ico"></head><body><header><h1 id="title">4chan Feedback</h1></header><div id="nav-links"><a href="{{ back }}">Back to feedback</a></div>
<section id="content"><table class="items-table" id="entries"><thead><tr><th>No.</th><th>Question</th><th class="col-date">Date / IP</th></tr></thead><tbody><tr data-category="{{ saved.category }}"><td class="col-id">{{ saved.id }}</td><td class="col-msg"><h3>[{{ saved.category_label }}] {{ saved.subject }}</h3><div class="feedback-text">{{ saved.message }}</div><div class="meta-blk"><div><b>UA:</b> {{ saved.user_agent }}</div><div><b>Lang:</b> {{ saved.language }}</div></div></td><td class="col-date">{{ date }}<div class="uid">{{ saved.address }}</div></td></tr></tbody></table></section></body></html>
